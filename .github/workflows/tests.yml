name: tests

on:
  push:
    branches: [master, main, protocol/v4-recovery-v2, protocol/v5-successor]
    tags: [v4-measurement-protocol-v3, v5-measurement-protocol-v1]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    # The leakage core is pure standard library. This job installs nothing and
    # proves the test suite passes with zero third-party dependencies, across
    # the supported Python versions.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests (no dependencies)
        run: python -m unittest discover -s tests -v

  inspect:
    # With the optional inspect_ai extra installed, the Inspect task-build tests
    # run too (they skip in the core job). Also lints with ruff.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with inspect extra
        # Pin ruff: an unpinned install drifts to whatever is latest, and a new
        # release can expand the default rule set (0.16.0 added UP037), turning
        # master red with no code change. Bump this deliberately.
        run: pip install -e ".[inspect]" "ruff==0.16.0"
      - name: Lint
        run: ruff check .
      - name: Run full test suite
        run: python -m unittest discover -s tests -v

  paper:
    # This is deliberately separate from the zero-dependency core matrix. It
    # exercises the generated candidate paper with the frozen protocol and the
    # exact Linux Tectonic binary used by GitHub Actions.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        id: candidate-python
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install paper test dependencies
        run: ${{ steps.candidate-python.outputs.python-path }} -m pip install -e ".[paper]"
      - uses: actions/setup-python@v5
        id: protocol-python
        with:
          python-version: "3.12.10"
          update-environment: false
      - name: Verify candidate and protocol Python identities
        shell: bash
        env:
          CANDIDATE_PYTHON: ${{ steps.candidate-python.outputs.python-path }}
          EXPECTED_CANDIDATE_VERSION: ${{ matrix.python-version }}
          PROTOCOL_PYTHON: ${{ steps.protocol-python.outputs.python-path }}
        run: |
          set -euo pipefail
          "$CANDIDATE_PYTHON" -c 'import os, platform, sys; expected = tuple(map(int, os.environ["EXPECTED_CANDIDATE_VERSION"].split("."))); actual = sys.version_info[:2]; print(sys.executable, platform.python_version()); assert platform.python_implementation() == "CPython" and actual == expected'
          env -u LD_LIBRARY_PATH -u PYTHONHOME -u PYTHONPATH "$PROTOCOL_PYTHON" -c 'import platform, sys; print(sys.executable, platform.python_version()); assert platform.python_implementation() == "CPython" and platform.python_version() == "3.12.10"'
      - name: Fetch pinned Tectonic
        shell: bash
        run: |
          set -euo pipefail
          asset="tectonic-0.17.0-x86_64-unknown-linux-gnu.tar.gz"
          url="https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/${asset}"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/$asset" "$url"
          echo "1a715688baf591e650c8aeb160ae934e181685eecbb38b317de30b269ac5d606  $RUNNER_TEMP/$asset" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/tectonic"
          tar --extract --gzip --file "$RUNNER_TEMP/$asset" --directory "$RUNNER_TEMP/tectonic"
          test "$(sha256sum "$RUNNER_TEMP/tectonic/tectonic" | awk '{print $1}')" = "2b3a86250906c92ed0a3ae8aaa454ec55bd6cede8593b3e549640177f6aecaa3"
          chmod +x "$RUNNER_TEMP/tectonic/tectonic"
      - name: Create and verify clean detached frozen protocol worktree
        shell: bash
        run: |
          set -euo pipefail
          protocol="$RUNNER_TEMP/anachron-v3-measurement-protocol-v1"
          frozen="cc28c9890455c5bde09ee5710c411ee229e0f9e5"
          origin="$(git remote get-url origin)"
          case "$origin" in
            https://github.com/LesterALeong/anachron|https://github.com/LesterALeong/anachron.git) ;;
            *) echo "unexpected origin: $origin" >&2; exit 1 ;;
          esac
          test "$(git ls-remote origin refs/heads/master | cut -f1)" = "$frozen"
          git remote set-url origin https://github.com/LesterALeong/anachron.git
          git fetch --no-tags origin refs/heads/master:refs/remotes/origin/master
          test "$(git rev-parse refs/remotes/origin/master)" = "$frozen"
          git update-ref refs/heads/master "$frozen"
          test "$(git rev-parse refs/heads/master)" = "$frozen"
          git worktree add --detach "$protocol" v3-measurement-protocol-v1
          test "$(git -C "$protocol" rev-parse --show-toplevel)" = "$protocol"
          test "$(git -C "$protocol" symbolic-ref -q HEAD; echo $?)" = "1"
          test "$(git -C "$protocol" rev-parse HEAD)" = "$frozen"
          test "$(git -C "$protocol" rev-parse refs/heads/master)" = "$frozen"
          test "$(git -C "$protocol" ls-remote origin refs/heads/master | cut -f1)" = "$frozen"
      - name: Run required candidate paper gate
        env:
          ANACHRON_V3_PROTOCOL_ROOT: ${{ runner.temp }}/anachron-v3-measurement-protocol-v1
          ANACHRON_V3_PROTOCOL_PYTHON: ${{ steps.protocol-python.outputs.python-path }}
          ANACHRON_V3_TECTONIC: ${{ runner.temp }}/tectonic/tectonic
          ANACHRON_V3_REQUIRE_PAPER_QA: "1"
        run: ${{ steps.candidate-python.outputs.python-path }} -m unittest tests.test_v3_candidate_projection tests.test_v3_candidate_paper tests.test_v3_candidate_review_release -v

  v4-paper:
    # This lane exercises only disposable local v4 fixtures. The sole network
    # operation is the pinned Tectonic archive download below. The fixtures
    # invoke no protocol Python subprocess, so no second interpreter is needed.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        id: candidate-python
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install v4 paper test dependencies
        run: ${{ steps.candidate-python.outputs.python-path }} -m pip install -e ".[paper]"
      - name: Verify candidate CPython identity
        shell: bash
        env:
          CANDIDATE_PYTHON: ${{ steps.candidate-python.outputs.python-path }}
          EXPECTED_CANDIDATE_VERSION: ${{ matrix.python-version }}
        run: |
          set -euo pipefail
          "$CANDIDATE_PYTHON" -c 'import os, platform, sys; expected = tuple(map(int, os.environ["EXPECTED_CANDIDATE_VERSION"].split("."))); actual = sys.version_info[:2]; print(sys.executable, platform.python_version()); assert platform.python_implementation() == "CPython" and actual == expected'
      - name: Fetch v4 pinned Tectonic
        shell: bash
        run: |
          set -euo pipefail
          asset="tectonic-0.17.0-x86_64-unknown-linux-gnu.tar.gz"
          url="https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/${asset}"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/$asset" "$url"
          echo "1a715688baf591e650c8aeb160ae934e181685eecbb38b317de30b269ac5d606  $RUNNER_TEMP/$asset" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/tectonic-v4"
          tar --extract --gzip --file "$RUNNER_TEMP/$asset" --directory "$RUNNER_TEMP/tectonic-v4"
          test "$(sha256sum "$RUNNER_TEMP/tectonic-v4/tectonic" | awk '{print $1}')" = "2b3a86250906c92ed0a3ae8aaa454ec55bd6cede8593b3e549640177f6aecaa3"
          chmod +x "$RUNNER_TEMP/tectonic-v4/tectonic"
      - name: Run disposable v4 candidate and release gates
        shell: bash
        env:
          ANACHRON_V4_TECTONIC: ${{ runner.temp }}/tectonic-v4/tectonic
          CANDIDATE_PYTHON: ${{ steps.candidate-python.outputs.python-path }}
        run: |
          set -euo pipefail
          env -u LD_LIBRARY_PATH -u PYTHONHOME -u PYTHONPATH "$CANDIDATE_PYTHON" -m unittest tests.test_v4_candidate_projection tests.test_v4_candidate_paper tests.test_v4_candidate_review_release tests.test_v4_candidate_outreach tests.test_v4_ci_workflow tests.test_v4_contract tests.test_v4_source_manifest tests.test_v4_materialization -v

  v5-scientific-source:
    # The scientific and source-generation boundary is pure local Python.
    # It does not render a PDF and makes no claim about Tectonic provenance.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: scientific-python
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run v5 scientific and source-generation gates
        run: |
          ${{ steps.scientific-python.outputs.python-path }} -m tools.validate_v5_contract --repository-root .
          ${{ steps.scientific-python.outputs.python-path }} -m unittest discover -s tests -p 'test_v5*.py' -v

  v5-render-smoke-nonhermetic:
    # Presentation-only smoke gate. Its fetched cache is isolated, but it is
    # non-hermetic and never contributes to GO or measurement-integrity claims.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: candidate-python
        with:
          python-version: "3.12"
      - name: Install v5 paper dependencies
        run: ${{ steps.candidate-python.outputs.python-path }} -m pip install -e ".[paper]"
      - name: Fetch v5 pinned Tectonic
        shell: bash
        run: |
          set -euo pipefail
          asset="tectonic-0.17.0-x86_64-unknown-linux-gnu.tar.gz"
          url="https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/${asset}"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/$asset" "$url"
          echo "1a715688baf591e650c8aeb160ae934e181685eecbb38b317de30b269ac5d606  $RUNNER_TEMP/$asset" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/tectonic-v5"
          tar --extract --gzip --file "$RUNNER_TEMP/$asset" --directory "$RUNNER_TEMP/tectonic-v5"
          test "$(sha256sum "$RUNNER_TEMP/tectonic-v5/tectonic" | awk '{print $1}')" = "2b3a86250906c92ed0a3ae8aaa454ec55bd6cede8593b3e549640177f6aecaa3"
          chmod +x "$RUNNER_TEMP/tectonic-v5/tectonic"
      - name: Provision isolated pinned v5 Tectonic cache
        shell: bash
        run: |
          set -euo pipefail
          cache="$RUNNER_TEMP/tectonic-v5-cache"
          bundle_url="https://relay.fullyjustified.net/default_bundle_v33.tar"
          cache_content_identifier="6ffe055852f8faf66c0acbe1a7fb27f87b869a90bad1204f3bf4d9683f597c7c"
          test ! -e "$cache"
          home="$RUNNER_TEMP/tectonic-v5-home"
          xdg="$RUNNER_TEMP/tectonic-v5-xdg"
          mkdir -p "$cache" "$home" "$xdg" "$RUNNER_TEMP/tectonic-v5-preflight"
          printf '%s\n' '\documentclass[10pt]{article}' '\usepackage[margin=0.85in]{geometry}' '\usepackage[T1]{fontenc}' '\usepackage{booktabs}' '\begin{document}' '\begin{tabular}{ll}\toprule A & B \\ \bottomrule\end{tabular}' '\cite{fixture}' '\bibliographystyle{plain}' '\bibliography{references}' '\end{document}' > "$RUNNER_TEMP/tectonic-v5-preflight/main.tex"
          printf '%s\n' '@article{fixture, author = {Fixture, F.}, title = {Fixture}, journal = {Fixture Journal}, year = {2026}}' > "$RUNNER_TEMP/tectonic-v5-preflight/references.bib"
          HOME="$home" XDG_CACHE_HOME="$xdg" TECTONIC_CACHE_DIR="$cache" "$RUNNER_TEMP/tectonic-v5/tectonic" --bundle "$bundle_url" --keep-logs --outdir "$RUNNER_TEMP/tectonic-v5-preflight/out" "$RUNNER_TEMP/tectonic-v5-preflight/main.tex"
          test -f "$RUNNER_TEMP/tectonic-v5-preflight/out/main.pdf"
          test "$(find "$cache/bundles/hashes" -type f -exec cat {} \; | tr -d '\n')" = "$cache_content_identifier"
          test -f "$cache/bundles/data/${cache_content_identifier}.index"
          test -d "$cache/bundles/data/$cache_content_identifier"
      - name: Run required v5 candidate lifecycle gate
        env:
          ANACHRON_V5_TECTONIC: ${{ runner.temp }}/tectonic-v5/tectonic
          HOME: ${{ runner.temp }}/tectonic-v5-home
          TECTONIC_CACHE_DIR: ${{ runner.temp }}/tectonic-v5-cache
          XDG_CACHE_HOME: ${{ runner.temp }}/tectonic-v5-xdg
        run: |
          ${{ steps.candidate-python.outputs.python-path }} -m tools.validate_v5_contract --repository-root .
          ${{ steps.candidate-python.outputs.python-path }} -m unittest tests.test_v5_candidate_projection tests.test_v5_candidate_paper tests.test_v5_candidate_review_release tests.test_v5_candidate_outreach tests.test_v5_candidate_end_to_end -v
