[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "anachron"
version = "0.1.0"
description = "Point-in-time tool-call leakage scoring for LLM agents, as an Inspect extension."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Lester Leong" }]
keywords = ["llm", "agents", "evaluation", "inspect", "temporal-leakage", "point-in-time"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
inspect = ["inspect_ai"]

[project.entry-points.inspect_ai]
anachron = "anachron._registry"

[tool.setuptools.packages.find]
include = ["anachron*"]
