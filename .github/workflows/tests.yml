name: tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  core:
    # The leakage core is pure standard library. This job installs nothing and
    # proves the test suite passes with zero third-party dependencies, across
    # the supported Python versions.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests (no dependencies)
        run: python -m unittest discover -s tests -v

  inspect:
    # With the optional inspect_ai extra installed, the Inspect task-build tests
    # run too (they skip in the core job). Also lints with ruff.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with inspect extra
        run: pip install -e ".[inspect]" ruff
      - name: Lint
        run: ruff check .
      - name: Run full test suite
        run: python -m unittest discover -s tests -v
